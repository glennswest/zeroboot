[workspace]
resolver = "2"
members = ["crates/zeroboot"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/glennswest/zeroboot"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
# Pure-Rust disk assembly: GPT tables + a FAT ESP written straight into the
# image file. No root, no loop devices, no external partitioning/format tools,
# so boot artifacts build anywhere (CI, macOS, a dev container).
gpt = "4"
fatfs = "0.3"
fscommon = "0.1"

[profile.release]
lto = true
strip = true
